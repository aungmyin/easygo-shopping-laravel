version: '3.8'

services:
  app:
    build: .
    container_name: easygo-app
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - mysql
      - redis
    networks:
      - laravel-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=easy_go_shopping
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel

  mysql:
    image: mysql:8.0
    container_name: easygo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: easy_go_shopping
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel-network

  redis:
    image: redis:7-alpine
    container_name: easygo-redis
    ports:
      - "6379:6379"
    networks:
      - laravel-network

  nginx:
    image: nginx:alpine
    container_name: easygo-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

volumes:
  mysql_data:

networks:
  laravel-network:
    driver: bridge
